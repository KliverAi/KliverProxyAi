name: Build & Deploy to Kubernetes

on:
  push:
    branches: [main]  # Solo se ejecuta cuando se hace push (merge) a main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Kubernetes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker tag and environment
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "env=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "qa" ]]; then
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "env=qa" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=pr-${{ github.event.number }}-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "env=qa" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Scaleway Container Registry
        run: |
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud \
            -u "${{ secrets.SCW_ACCESS_KEY }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE_SHA="rg.fr-par.scw.cloud/kliver/kliver-ai:${{ steps.tag.outputs.tag }}"
          IMAGE_ENV="rg.fr-par.scw.cloud/kliver/kliver-ai:${{ steps.tag.outputs.env }}"
          docker build -t $IMAGE_SHA -t $IMAGE_ENV .
          docker push $IMAGE_SHA
          docker push $IMAGE_ENV
          echo "✅ Built and pushed: $IMAGE_SHA and $IMAGE_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl for Scaleway
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          
          # Debug: Show kubeconfig content (without sensitive data)
          echo "Kubeconfig file size:"
          ls -la ~/.kube/config
          
          echo "Kubeconfig structure:"
          kubectl config view --minify
          
          # List available contexts
          echo "Available contexts:"
          kubectl config get-contexts
          
          # Check if there are any contexts
          CONTEXTS=$(kubectl config get-contexts -o name)
          if [ -z "$CONTEXTS" ]; then
            echo "No contexts found in kubeconfig!"
            echo "Full kubeconfig content (sanitized):"
            kubectl config view
            exit 1
          fi
          
          # Set the correct context (use the first available context)
          CONTEXT=$(echo "$CONTEXTS" | head -n 1)
          echo "Setting context to: $CONTEXT"
          kubectl config use-context "$CONTEXT"
          
          # Verify current context
          echo "Current context:"
          kubectl config current-context

      - name: Update image tag in deployment
        run: |
          DEPLOYMENT_NAME=kliver-ai-${{ steps.tag.outputs.env }}
          kubectl set image deployment/$DEPLOYMENT_NAME \
            kliver-ai=rg.fr-par.scw.cloud/kliver/kliver-ai:${{ steps.tag.outputs.env }} \
            -n kliver-${{ steps.tag.outputs.env }}

      - name: Force redeploy with timestamp annotation
        run: |
          DEPLOYMENT_NAME=kliver-ai-${{ steps.tag.outputs.env }}
          kubectl patch deployment $DEPLOYMENT_NAME -n kliver-${{ steps.tag.outputs.env }} \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"force-redeploy\":\"$(date +%s)\"}}}}}"

      - name: Wait for rollout to complete
        run: |
          DEPLOYMENT_NAME=kliver-ai-${{ steps.tag.outputs.env }}
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n kliver-${{ steps.tag.outputs.env }} --timeout=300s

      - name: Verify deployment
        run: |
          DEPLOYMENT_NAME=kliver-ai-${{ steps.tag.outputs.env }}
          kubectl get pods -l app.kubernetes.io/name=kliver-ai,app.kubernetes.io/instance=$DEPLOYMENT_NAME -n kliver-${{ steps.tag.outputs.env }}
          echo "🚀 Successfully deployed kliver-ai:${{ steps.tag.outputs.tag }} to ${{ steps.tag.outputs.env }}"