name: Deploy Azure

on:
  push:
    branches: [qa, main]

jobs:
  build-and-push-to-acr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Determinar tag según la rama
      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=qa" >> $GITHUB_OUTPUT
          fi

      # Login Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login al ACR
      - name: Login to ACR
        run: |
          az acr login --name kliverairegistry

      # Build Docker
      - name: Build Docker image
        run: |
          IMAGE="kliverairegistry.azurecr.io/kliver-proxy-ai:${{ steps.tag.outputs.tag }}"
          echo "Building $IMAGE"
          docker build -t $IMAGE .

      # Push Docker
      - name: Push Docker image
        run: |
          IMAGE="kliverairegistry.azurecr.io/kliver-proxy-ai:${{ steps.tag.outputs.tag }}"
          echo "Pushing $IMAGE"
          docker push $IMAGE
          echo "🚀 Image published to Azure ACR: $IMAGE"

      # Update App Service with new container image
      - name: Update App Service
        run: |
          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name kliverairegistry.azurecr.io/kliver-proxy-ai:${{ steps.tag.outputs.tag }} \
            --docker-registry-server-url https://kliverairegistry.azurecr.io
          echo "✅ App Service updated with new image"
          
      # Restart App Service to pull the new image
      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
          echo "✅ App Service restarted"