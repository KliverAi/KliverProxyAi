name: Deploy Azure

on:
  pull_request:
    branches: [qa]

jobs:
  build-and-push-to-acr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tag fijo para QA
      - name: Set image tag
        id: tag
        run: |
          echo "tag=qa" >> $GITHUB_OUTPUT

      # Login Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login al ACR
      - name: Login to ACR
        run: |
          az acr login --name kliveracrmuqifeddswzfo

      # Build Docker
      - name: Build Docker image
        run: |
          IMAGE="kliveracrmuqifeddswzfo.azurecr.io/kliver-proxy-ai:qa"
          echo "Building $IMAGE"
          docker build -t $IMAGE .

      # Push Docker
      - name: Push Docker image
        run: |
          IMAGE="kliveracrmuqifeddswzfo.azurecr.io/kliver-proxy-ai:qa"
          echo "Pushing $IMAGE"
          docker push $IMAGE
          echo "🚀 Image published to Azure ACR: $IMAGE"

      # Get ACR credentials
      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_USERNAME=$(az acr credential show --name kliveracrmuqifeddswzfo --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name kliveracrmuqifeddswzfo --query passwords[0].value -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          echo "username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      # Update App Service with new container image
      - name: Update App Service
        run: |
          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --container-image-name kliveracrmuqifeddswzfo.azurecr.io/kliver-proxy-ai:qa \
            --container-registry-url https://kliveracrmuqifeddswzfo.azurecr.io \
            --container-registry-user ${{ steps.acr-creds.outputs.username }} \
            --container-registry-password ${{ steps.acr-creds.outputs.password }}
          echo "✅ App Service updated with new image"
          
      # Restart App Service to pull the new image
      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
          echo "✅ App Service restarted"