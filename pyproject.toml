[project]
name = "kliverai"
version = "0.1.0"
description = "Kliver.AI Chat API - Multi-provider AI chat service"
authors = [
    {name = "Germán Küber",email = "german.kuber@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "azure-monitor-opentelemetry>=1.6.0",
    "google-generativeai (>=0.8.5,<0.9.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pypdf2 (>=3.0.1,<4.0.0)"
]

[tool.poetry]
name = "kliverai"
version = "0.1.0"
description = "Kliver.AI Chat API - Multi-provider AI chat service"
authors = ["Germán Küber <german.kuber@outlook.com>"]
readme = "README.md"
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.1"

